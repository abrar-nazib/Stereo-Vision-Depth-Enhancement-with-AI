[project]
name = "stereo-vision-depth-enhancement-with-ai"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "imageio>=2.37.4",
    "matplotlib>=3.11.2",
    "omegaconf>=2.3.1",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "tensorboard>=2.21.0",
    "timm>=1.0.30",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "tqdm>=4.70.1",
    "ultralytics>=8.4.163",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
dev = [
    "modal>=1.6.0",
    "pytest>=9.1.1",
]
